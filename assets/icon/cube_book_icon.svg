<rect x="210" y="0" width="105" height="210" fill="#C4B5FD" stroke="#000" stroke-width="8"/>
<text x="262.5" y="105" font-family="'Space Grotesk', sans-serif" font-size="90" font-weight="900" text-anchor="middle" dominant-baseline="central" fill="#000">B</text>

