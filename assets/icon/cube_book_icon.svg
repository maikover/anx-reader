<rect x="105" y="0" width="105" height="210" fill="#FFD93D" stroke="#000" stroke-width="8"/>
<text x="157.5" y="105" font-family="'Space Grotesk', sans-serif" font-size="90" font-weight="900" text-anchor="middle" dominant-baseline="central" fill="#000">U</text>

